services:
  db:
    image: postgres:18-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: mbos
      POSTGRES_USER: mbos
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mbos -d mbos"]
      interval: 5s
      timeout: 5s
      retries: 20
  web:
    build:
      context: ../..
      dockerfile: deployment/linode/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://mbos:${POSTGRES_PASSWORD}@db:5432/mbos
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_API_KEY: ${ADMIN_API_KEY:-${ADMIN_PASSWORD:-}}
      HOMEPAGE_CMS_ENABLED: ${HOMEPAGE_CMS_ENABLED:-true}
      EMAIL_USER: ${EMAIL_USER:-}
      EMAIL_PASS: ${EMAIL_PASS:-}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
      AWS_BUCKET_NAME: ${AWS_BUCKET_NAME:-assets}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_ENDPOINT_URL_S3: ${AWS_ENDPOINT_URL_S3:-}
      AWS_REGION: ${AWS_REGION:-ap-southeast-1}
    ports:
      - '127.0.0.1:5101:5101'
    volumes:
      - ../../data/blog-export/uploads:/app/data/uploads:rw
      - ../../data/blog-export:/app/data/blog-export:ro
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres:
